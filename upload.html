<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Image Upload</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .upload-container {
        border: 2px dashed #ccc;
        border-radius: 5px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
      }
      .preview {
        margin-top: 20px;
        display: none;
      }
      .preview img {
        max-width: 100%;
        max-height: 300px;
      }
      .result {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        display: none;
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:disabled {
        background-color: #cccccc;
      }
    </style>
  </head>
  <body>
    <h1>Upload Project Image</h1>

    <div class="upload-container">
      <input type="file" id="imageInput" accept="image/*" />
      <div class="preview" id="imagePreview">
        <h3>Image Preview:</h3>
        <img id="previewImg" src="#" alt="Preview" />
      </div>
      <button id="uploadButton">Upload Image</button>
    </div>

    <div class="result" id="resultContainer">
      <h3>Upload Result:</h3>
      <pre id="resultJson"></pre>
      <div id="uploadedImage"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const imageInput = document.getElementById("imageInput");
        const previewImg = document.getElementById("previewImg");
        const imagePreview = document.getElementById("imagePreview");
        const uploadButton = document.getElementById("uploadButton");
        const resultContainer = document.getElementById("resultContainer");
        const resultJson = document.getElementById("resultJson");
        const uploadedImage = document.getElementById("uploadedImage");

        // Show preview when file is selected
        imageInput.addEventListener("change", function () {
          const file = this.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              previewImg.src = e.target.result;
              imagePreview.style.display = "block";
              uploadButton.disabled = false;
            };
            reader.readAsDataURL(file);
          }
        });

        // Handle the upload
        uploadButton.addEventListener("click", function () {
          const file = imageInput.files[0];
          if (!file) {
            alert("Please select an image first");
            return;
          }

          uploadButton.disabled = true;
          uploadButton.textContent = "Uploading...";

          const formData = new FormData();
          formData.append("image", file);

          fetch("/v1/upload-project-images", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              // Display the JSON result
              resultJson.textContent = JSON.stringify(data, null, 2);
              resultContainer.style.display = "block";

              // If successful, show the uploaded image using the returned link
              if (data.success) {
                uploadedImage.innerHTML = `
                            <h3>Uploaded Image:</h3>
                            <p><strong>Link:</strong> <a href="${data.link}" target="_blank">${data.link}</a></p>
                            <img src="${data.link}" alt="Uploaded Image" style="max-width: 100%;">
                        `;
              }

              uploadButton.textContent = "Upload Complete";
            })
            .catch((error) => {
              console.error("Error:", error);
              resultJson.textContent = "Error: " + error.message;
              resultContainer.style.display = "block";
              uploadButton.textContent = "Upload Failed";
            })
            .finally(() => {
              setTimeout(() => {
                uploadButton.disabled = false;
                uploadButton.textContent = "Upload Image";
              }, 2000);
            });
        });
      });
    </script>
  </body>
</html>
